[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "npguard"
version = "0.4.0.dev0"
description = "NumPy memory observability and explanation tool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Priyanshu Rauth" }
]

keywords = [
  "numpy",
  "memory",
  "profiling",
  "performance",
  "scientific-computing",
  "Priyanshu Rauth",
  "npguard",
  "memory management"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Debuggers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only"
]

dependencies = [
  "numpy>=1.23.5,<3"
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "flake8>=6", "build>=1.2"]

[tool.setuptools.packages.find]
include = ["npguard*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["npguard"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[project.urls]
Homepage = "https://github.com/PriyanshuRaut/RNPY"
Issues = "https://github.com/PriyanshuRaut/RNPY/issues"
